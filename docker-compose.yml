services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: opsmemory
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opsmemory"]
      interval: 5s
      timeout: 3s
      retries: 20
  prometheus:
    image: prom/prometheus@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
  canary:
    image: python:3.12-slim
    restart: unless-stopped
    environment:
      CANARY_START_DEGRADED: "true"
      CANARY_REMEDIATION_TOKEN: ${CANARY_REMEDIATION_TOKEN:?Set CANARY_REMEDIATION_TOKEN in .env}
    command: ["python", "/app/app.py"]
    volumes:
      - ./canary:/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/state', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  gateway:
    image: python:3.12-slim
    restart: unless-stopped
    environment:
      GATEWAY_START_DEGRADED: "true"
      GATEWAY_REMEDIATION_TOKEN: ${GATEWAY_REMEDIATION_TOKEN:?Set GATEWAY_REMEDIATION_TOKEN in .env}
    command: ["python", "/app/app.py"]
    volumes:
      - ./gateway:/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/state', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PROMETHEUS_BASE_URL: http://prometheus:9090
      CANARY_BASE_URL: http://canary:8081
      CANARY_REMEDIATION_TOKEN: ${CANARY_REMEDIATION_TOKEN:?Set CANARY_REMEDIATION_TOKEN in .env}
      GATEWAY_BASE_URL: http://gateway:8082
      GATEWAY_REMEDIATION_TOKEN: ${GATEWAY_REMEDIATION_TOKEN:?Set GATEWAY_REMEDIATION_TOKEN in .env}
      OPSMEMORY_USE_ADAPTER_REGISTRY: "true"
    depends_on:
      db:
        condition: service_healthy
      canary:
        condition: service_healthy
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./frontend:/app/frontend:ro
volumes:
  pgdata:
  promdata:
